<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Event Hub | Discover & Join Events</title>
    <meta name="description" content="Centralized hub for youth community events. RSVP, track real-time availability, and manage event attendance effortlessly.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">CommunityHub</div>
            <div class="user-profile">
                <div style="width: 35px; height: 35px; background: var(--surface); border-radius: 50%; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center;">
                    👤
                </div>
            </div>
        </header>

        <!-- Toast Notification -->
        <div id="toast" class="toast">
            <span id="toast-icon">✨</span>
            <span id="toast-message">Message here</span>
        </div>

        <!-- Registration Modal -->
        <div id="registration-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Complete RSVP</h2>
                    <button class="close-btn" onclick="closeModal()">&times;</button>
                </div>
                <p style="margin-bottom: 20px;">Please provide your details to secure your spot.</p>
                <form id="rsvp-form">
                    <div class="form-group">
                        <label for="user-name">Full Name</label>
                        <input type="text" id="user-name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="user-email">Email Address</label>
                        <input type="email" id="user-email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="user-mobile">Mobile Number</label>
                        <input type="tel" id="user-mobile" placeholder="+65 8123 4567" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">
                        Confirm RSVP
                    </button>
                </form>
            </div>
        </div>

        <!-- Discover View -->
        <main id="discover-view" class="view active">
            <div class="hero-section" style="margin-bottom: 30px; animation: fadeIn 0.8s ease;">
                <h1>Explore Events</h1>
                <p>Find and join local community gatherings.</p>
            </div>

            <div id="event-grid" class="event-grid">
                <!-- Events will be rendered here via JS -->
            </div>
        </main>

        <!-- Organizer Dashboard View -->
        <main id="dashboard-view" class="view">
            <div class="hero-section" style="margin-bottom: 30px;">
                <h1>Organizer Dashboard</h1>
                <p>Real-time analytics for your events.</p>
            </div>

            <div class="dashboard-stats">
                <div class="stat-card">
                    <div id="stat-total-rsvps" class="stat-value">0</div>
                    <div class="stat-label">Your RSVPs</div>
                </div>
                <div class="stat-card">
                    <div id="stat-active-events" class="stat-value">0</div>
                    <div class="stat-label">Active Events</div>
                </div>
            </div>

            <h2 style="margin-top: 30px; margin-bottom: 15px;">Event Attendance</h2>
            <div id="attendee-summary">
                <!-- Dashboard stats rendered here -->
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active" data-view="discover">
                <span class="nav-icon">🧭</span>
                <span>Discover</span>
            </a>
            <a href="#" class="nav-item" data-view="dashboard">
                <span class="nav-icon">📊</span>
                <span>Dashboard</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">👤</span>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
</body>
</html>
